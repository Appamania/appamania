# PRD v4 §24: every PR and push to main or dev.
name: ci
on:
  pull_request:
  push:
    branches: [main, dev]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      # PRD v4 §22. High/critical still fail. The only exception is
      # GHSA-gcqx-w48m-w2h4 (deepmerge, no fix, React Email only) — see scripts/audit-prod.mjs.
      - run: node scripts/audit-prod.mjs
      - run: npm run lint && npm run typecheck
      - run: npm run check:tokens
      # setup-cli@v1 defaults to 2.20.3, which rejects this config.toml
      # (auth.oauth_server, storage.vector, db.health_timeout, and others).
      # 2.122.1 is the latest stable v2 and still accepts [inbucket].
      - uses: supabase/setup-cli@v1
        with:
          version: 2.122.1
      - run: supabase start && supabase db reset && supabase test db
      - run: ./scripts/local-env.sh # NEXT_PUBLIC_* are inlined at build time
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium && npm run e2e
        env: { CI: "true" }
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: playwright-report, path: playwright-report, retention-days: 7 }
