# Next.js on Netlify needs all three of these: the build command, the .next publish folder, and the plugin.
# Dropping the plugin publishes the raw .next folder as a static site (every route 404s). Dropping publish makes the
# plugin fail with "publish directory cannot be the same as the base directory". Deploy previews are free; production
# deploys cost credits.
[build]
  command = "npm run build"
  publish = ".next"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[build.environment]
  NODE_VERSION = "24"
  # These three are public by design: Next.js writes NEXT_PUBLIC_* values into the browser bundle, so Netlify's
  # secret scan would always flag them. Real secrets must never use a NEXT_PUBLIC_ name. The Firebase web key is
  # limited by the referrer list in Google Cloud and by firestore.rules (anonymous notes create only).
  SECRETS_SCAN_OMIT_KEYS = "NEXT_PUBLIC_FIREBASE_API_KEY,NEXT_PUBLIC_FIREBASE_PROJECT_ID,NEXT_PUBLIC_GA_MEASUREMENT_ID"
